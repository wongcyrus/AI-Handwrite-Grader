name: Deploy AI Grader

on:
  push:
    branches: [ user-friendly-mode ]
  pull_request:
    branches: [ user-friendly-mode ]

env:
  AZURE_CONTAINER_REGISTRY: aigraderdev
  IMAGE_NAME: ai-grader-app

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      azurite:
        image: mcr.microsoft.com/azure-storage/azurite:latest
        ports:
          - 10000:10000
          - 10001:10001
          - 10002:10002
        options: >-
          --health-cmd "curl -f http://localhost:10002/devstoreaccount1 || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        cd app
        pip install -r requirements.txt
        pip install -r requirements-test.txt
    
    - name: Wait for Azurite
      run: |
        timeout 30 bash -c 'until curl -f http://localhost:10002/devstoreaccount1; do sleep 1; done'
    
    - name: Run tests
      run: |
        cd app
        export FLASK_ENV=testing
        export AZURE_STORAGE_CONNECTION_STRING="DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://localhost:10000/devstoreaccount1;QueueEndpoint=http://localhost:10001/devstoreaccount1;TableEndpoint=http://localhost:10002/devstoreaccount1;"
        export AI_FOUNDRY_ENDPOINT="https://test.cognitiveservices.azure.com/"
        export MODEL_DEPLOYMENT_NAME="gpt-4o-mini"
        export SECRET_KEY="test-secret-key"
        pytest tests/test_storage_service.py tests/test_models.py tests/test_ai_foundry_service.py tests/test_pdf_processing_service.py tests/test_question_annotation_service.py tests/test_ai_scoring_service.py tests/test_manual_scoring_service.py tests/test_workflow_integration.py --verbose --cov=. --cov-report=xml
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./app/coverage.xml
        fail_ci_if_error: false

  build-and-deploy:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/user-friendly-mode'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Log in to Azure Container Registry
      uses: azure/docker-login@v1
      with:
        login-server: ${{ env.AZURE_CONTAINER_REGISTRY }}.azurecr.io
        username: ${{ secrets.AZURE_ACR_USERNAME }}
        password: ${{ secrets.AZURE_ACR_PASSWORD }}
    
    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: ./app
        push: true
        tags: |
          ${{ env.AZURE_CONTAINER_REGISTRY }}.azurecr.io/${{ env.IMAGE_NAME }}:latest
          ${{ env.AZURE_CONTAINER_REGISTRY }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
    
    - name: Azure Login
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}
    
    - name: Deploy to Azure Container Instances
      run: |
        az container restart \
          --resource-group ai-grader-dev-rg \
          --name ai-grader-dev-web \
          --no-wait
    
    - name: Run Terraform
      if: github.ref == 'refs/heads/user-friendly-mode'
      run: |
        cd terraform/environments/dev
        terraform init
        terraform plan -var-file="terraform.tfvars"
        terraform apply -auto-approve -var-file="terraform.tfvars"
